  <style>
    :root {
      --bg-dark: #070b14;
      --bg-panel: rgba(13, 22, 41, 0.85);
      --bg-card: rgba(18, 30, 56, 0.65);
      --bg-card-hover: rgba(26, 42, 77, 0.85);
      --bg-code: #0b1120;
      
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(0, 242, 254, 0.5);
      --border-glow: rgba(0, 242, 254, 0.25);
      
      --color-primary: #00f2fe;
      --color-accent: #38bdf8;
      --color-success: #10b981;
      --color-warning: #f59e0b;
      --color-danger: #ef4444;
      --color-purple: #a855f7;
      
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      
      --bounce-timing: cubic-bezier(0.34, 1.56, 0.64, 1);
      --font-display: 'Noto Sans TC', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-display);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(ellipse at 80% 10%, rgba(0, 242, 254, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 20% 90%, rgba(16, 185, 129, 0.04) 0%, transparent 50%),
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
    }

    /* 頂部導航 */
    header.inspector-header {
      z-index: 50;
      background: rgba(8, 12, 22, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(168, 85, 247, 0.15));
      border: 1px solid var(--color-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px var(--border-glow);
    }

    .brand-badge svg {
      width: 20px;
      height: 20px;
      stroke: var(--color-primary);
      fill: none;
      stroke-width: 2.2;
    }

    .brand-title h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #fff, #93c5fd, #00f2fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-title p {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    .header-links {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-nav {
      padding: 7px 14px;
      border-radius: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s var(--bounce-timing);
    }

    .btn-nav:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--border-glow);
    }

    /* 主雙欄版面 */
    main.inspector-body {
      flex: 1;
      display: grid;
      grid-template-columns: 380px 1fr;
      overflow: hidden;
      width: 100%;
      height: calc(100vh - 64px);
    }

    /* 左欄：檢核項目樹狀導航 */
    aside.nav-sidebar {
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--border-subtle);
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-subtle) transparent;
    }

    aside.nav-sidebar::-webkit-scrollbar {
      width: 5px;
    }
    aside.nav-sidebar::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 4px;
    }

    .filter-bar {
      display: flex;
      gap: 6px;
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }

    .btn-filter {
      flex: 1;
      padding: 6px 4px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .btn-filter.active {
      background: var(--color-primary);
      color: #04101e;
      font-weight: 800;
    }

    .item-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.3s var(--bounce-timing);
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    .item-card:hover {
      background: var(--bg-card-hover);
      border-color: rgba(0, 242, 254, 0.4);
      transform: translateX(3px);
    }

    .item-card.active {
      background: rgba(18, 38, 77, 0.9);
      border-color: var(--color-primary);
      box-shadow: 0 4px 16px rgba(0, 242, 254, 0.2);
    }

    .item-card.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--color-primary);
      border-radius: 4px 0 0 4px;
      box-shadow: 0 0 10px var(--color-primary);
    }

    .item-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-dim-tag {
      font-size: 9px;
      font-family: var(--font-mono);
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    .item-card.active .item-dim-tag {
      background: rgba(0, 242, 254, 0.2);
      color: var(--color-primary);
    }

    .item-line-badge {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--color-success);
      font-weight: 700;
    }

    .item-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.35;
    }

    .item-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* 右欄：程式碼透視鏡檢視面板 */
    section.code-stage {
      overflow-y: auto;
      padding: 28px 36px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      background: rgba(4, 8, 16, 0.6);
    }

    .stage-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
    }

    .detail-header-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 16px;
    }

    .detail-meta-group h2 {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .detail-meta-group h2 span.dim-indicator {
      font-size: 12px;
      font-family: var(--font-mono);
      color: var(--color-primary);
      background: rgba(0, 242, 254, 0.12);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid rgba(0, 242, 254, 0.3);
    }

    .detail-meta-group p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.5;
    }

    .detail-status-box {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    .status-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--color-success);
      border: 1px solid rgba(16, 185, 129, 0.35);
    }

    .exact-file-link {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--color-primary);
      text-decoration: underline;
      cursor: pointer;
    }

    /* 程式碼展示窗 */
    .code-viewer-block {
      background: var(--bg-code);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .code-viewer-bar {
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-dim);
    }

    .code-content-pre {
      padding: 16px 20px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.6;
      color: #e2e8f0;
      background: transparent;
      margin: 0;
    }

    /* 語法反光標籤 */
    .hl-kw { color: #f43f5e; font-weight: 600; }
    .hl-prop { color: #38bdf8; }
    .hl-val { color: #a3e635; }
    .hl-str { color: #fde047; }
    .hl-tag { color: #2dd4bf; }
    .hl-comm { color: #64748b; font-style: italic; }
    .hl-fn { color: #c084fc; font-weight: 600; }

    /* 原理解析與關鍵參數分析卡 */
    .analysis-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .analysis-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .analysis-card h4 {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .analysis-card h4::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-primary);
    }

    .analysis-card p {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* 線上試聽試按小工具 */
    .interactive-inline-tool {
      background: rgba(0, 242, 254, 0.05);
      border: 1px dashed rgba(0, 242, 254, 0.3);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-test-action {
      background: var(--color-primary);
      color: #04101e;
      border: none;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s var(--bounce-timing);
    }

    .btn-test-action:hover {
      transform: scale(1.06);
      box-shadow: 0 0 15px var(--border-glow);
    }

    .btn-test-action:active {
      transform: scale(0.96);
    }
  </style>
</head>

    // 轉義 HTML 標籤
    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
